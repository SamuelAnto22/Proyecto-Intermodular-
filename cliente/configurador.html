<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Configurador de vehículos de Midnight Customs. Personaliza tu coche y guarda tu configuración.">
    <title>Configurador | Midnight Customs</title>
    <link rel="stylesheet" href="assets/css/style.css?v=7">
    <link rel="stylesheet" href="assets/css/animaciones.css?v=7">
    <style>
        .configurador-page {
            padding: 2rem 5%;
        }

        .configurador-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2rem;
            align-items: start;
            max-width: 1300px;
            margin: 0 auto;
        }

        .vista-coche {
            background: var(--fondo-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .panel-opciones {
            background: var(--fondo-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 100px;
        }

        .panel-opciones h3 {
            color: var(--color1);
            text-shadow: 0 0 10px var(--brillo1);
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 3px;
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
        }

        .opcion-grupo {
            margin-bottom: 1.4rem;
        }

        .opcion-grupo label {
            display: block;
            color: var(--gris);
            font-size: 0.82rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .opcion-grupo select {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 8px;
            color: var(--blanco);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .opcion-grupo select:focus {
            border-color: var(--color1);
            box-shadow: 0 0 10px var(--brillo1);
        }

        .opcion-grupo select option {
            background: #12121e;
            color: var(--blanco);
        }

        #guardarConfig {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        #mensajeGuardado {
            display: none;
            background: rgba(82, 226, 82, 0.12);
            border: 1px solid rgba(82, 226, 82, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #80ff80;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        #mensajeError {
            display: none;
            background: rgba(226, 82, 82, 0.12);
            border: 1px solid rgba(226, 82, 82, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #ff8080;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        @media (max-width: 900px) {
            .configurador-container {
                grid-template-columns: 1fr;
            }

            .panel-opciones {
                position: static;
            }
        }
    </style>
</head>

<body>
    <header class="cabecera-principal">
        <div class="logo">
            <a href="index.html">
                <img src="assets/img/icon-Photoroom.png" alt="Logotipo de Midnight Customs">
                <span style="color:var(--color1);margin-right:5px;">Midnight</span><span
                    style="color:var(--color2);">Customs</span>
            </a>
        </div>
        <button class="boton-menu" aria-label="Abrir menú">☰</button>
        <nav class="navegacion-principal" id="navegacion-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="configurador.html" class="boton-neon boton-neon-nav">🔧 Configurador</a></li>
                <li><a href="garaje.html">Mi Garaje</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="configurador-page">
        <div class="titulo-seccion" style="margin-bottom:2rem;">
            <h1 id="titulo-configurador">Configura tu Coche</h1>
        </div>

        <div class="configurador-container">
            <!-- Visor de visualización -->
            <div class="vista-coche">
                <div id="coche-visor"
                    style="position: relative; width: 100%; max-width: 800px; height: 400px; display: flex; align-items: center; justify-content: center;">
                    <br>
                    <div id="contenedor-coche"
                        style="position: relative; width: 640px; height: 360px;">
                        <!-- La carrocería (z-index: 2). Se añade object-fit:contain y object-position:bottom para normalizar el recorte diferente entre el rojo y el azul -->
                        <img id="capa-carroceria" src="assets/img/mini-rojo.png" alt="Mini Cooper Carrocería"
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; z-index: 2; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.8));">

                        <!-- Añadimos object-fit: contain y forzamos proporciones cuadradas (width = height) para no deformar -->
                        <img id="capa-rueda-delantera" src="assets/img/rueda-clasica.png" alt="Rueda Delantera"
                            style="position: absolute; top: 62px; left: -79px; width: 445px; height: 304px; z-index: 3; object-fit: contain; border-radius: 50%;">
                        <img id="capa-rueda-trasera" src="assets/img/rueda-clasica.png" alt="Rueda Trasera"
                            style="position: absolute; top: 62px; left: 282px; width: 445px; height: 304px; z-index: 3; object-fit: contain; border-radius: 50%;">

                    </div>
                    <style>
                        @keyframes rotarV {
                            from {
                                transform: rotate(0deg);
                            }

                            to {
                                transform: rotate(360deg);
                            }
                        }
                    </style>
                </div>
            </div>

            <!-- Panel de opciones -->
            <div class="panel-opciones">
                <h3>Personalización</h3>

                <div class="opcion-grupo">
                    <label for="modelo">Modelo</label>
                    <select id="modelo">
                        <option value="mini_cooper">Mini Cooper</option>
                        <option value="bmw_serie1">BMW Serie 1</option>
                        <option value="audi_a3">Audi A3</option>
                        <option value="volkswagen_golf">Porsche Cayenne</option>
                        <option value="toyota_supra">Toyota Supra</option>
                    </select>
                </div>

                <div class="opcion-grupo">
                    <label for="color">Color</label>
                    <select id="color">
                        <option value="rojo">Rojo (Default)</option>
                        <option value="azul">Azul</option>
                        <option value="verde">Verde</option>
                        <option value="blanco">Blanco</option>
                        <option value="negro">Negro</option>
                    </select>
                </div>

                <div class="opcion-grupo">
                    <label for="llantas">Llantas</label>
                    <select id="llantas">
                        <option value="clasica">Clásica</option>
                        <option value="deportiva">Deportiva</option>
                        <option value="competicion">Competición</option>
                        <option value="multiradio">Lujo Multi-radio</option>
                        <option value="palos">Clásica 5 Palos</option>
                    </select>
                </div>



                <button class="boton-neon" id="guardarConfig">💾 Guardar Configuración</button>
                <div id="mensajeGuardado">✅ ¡Configuración guardada!</div>
                <div id="mensajeError">⚠ Debes iniciar sesión para guardar. <a href="login.html"
                        style="color:var(--color2);">Ir al login</a></div>
            </div>
        </div>
    </main>

    <script src="assets/js/pie-pagina.js?v=7"></script>
    <script src="assets/js/main.js?v=7"></script>
    <script src="assets/js/configurador.js?v=7"></script>
</body>

</html>
