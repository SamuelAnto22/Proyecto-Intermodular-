<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Midnight Customs para acceder al configurador de vehículos.">
    <title>Iniciar Sesión | Midnight Customs</title>
    <link rel="stylesheet" href="assets/css/style.css?v=7">
    <link rel="stylesheet" href="assets/css/animaciones.css?v=7">
    <!-- Estilos específicos -->
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="contenedor-auth">
        <div class="caja-auth">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <img src="assets/img/icon-Photoroom.png" alt="Logo" style="height:60px;mix-blend-mode:screen;filter:drop-shadow(0 0 8px var(--brillo1))">
            </div>
            <h1>Bienvenido</h1>
            <p class="subtitulo-auth">Accede a tu cuenta de Midnight Customs</p>

            <div id="mensajeError" role="alert" aria-live="assertive" aria-atomic="true"></div>

            <form id="loginForm" action="../servidor/api/login.php" method="POST" novalidate>
                <div class="auth-grupo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="email" aria-required="true" aria-describedby="error-email">
                    <span class="campo-ayuda" id="error-email" aria-live="polite"></span>
                </div>
                <div class="auth-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" aria-required="true" aria-describedby="error-password">
                    <span class="campo-ayuda" id="error-password" aria-live="polite"></span>
                </div>
                <button type="submit" class="boton-neon btn-auth">Iniciar sesión</button>
            </form>

            <div class="enlace-auth">
                ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
            </div>
            <a href="index.html" class="volver-inicio">← Volver al inicio</a>
        </div>
    </div>

    <script type="module" src="assets/js/login.js?v=8"></script>
</body>
</html>
