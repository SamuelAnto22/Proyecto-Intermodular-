<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Midnight Customs para acceder al configurador de vehículos.">
    <title>Iniciar Sesión | Midnight Customs</title>
    <link rel="stylesheet" href="assets/css/style.css?v=7">
    <link rel="stylesheet" href="assets/css/animaciones.css?v=7">
    <style>
        .contenedor-auth {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at 30% 50%, rgba(192,82,226,0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(230,141,255,0.08) 0%, transparent 50%);
        }
        .caja-auth {
            background: var(--fondo-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(15px);
        }
        .caja-auth h1 {
            font-size: 2.5rem;
            color: var(--color1);
            text-shadow: 0 0 15px var(--brillo1);
            text-align: center;
            margin-bottom: 0.4rem;
        }
        .caja-auth .subtitulo-auth {
            text-align: center;
            color: var(--gris);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }
        .auth-grupo {
            margin-bottom: 1.4rem;
        }
        .auth-grupo label {
            display: block;
            color: var(--gris);
            font-size: 0.82rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        .auth-grupo input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 8px;
            color: var(--blanco);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            box-sizing: border-box;
        }
        .auth-grupo input:focus {
            border-color: var(--color1);
            box-shadow: 0 0 10px var(--brillo1);
        }
        #mensajeError {
            background: rgba(226,82,82,0.15);
            border: 1px solid rgba(226,82,82,0.4);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #ff8080;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        .btn-auth {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }
        .enlace-auth {
            text-align: center;
            margin-top: 1.8rem;
            color: var(--gris);
            font-size: 0.9rem;
        }
        .enlace-auth a {
            color: var(--color2);
            text-decoration: none;
            font-weight: 600;
        }
        .enlace-auth a:hover {
            text-shadow: 0 0 8px var(--brillo2);
        }
        .volver-inicio {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--gris);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .volver-inicio:hover { color: var(--blanco); }
    </style>
</head>
<body>
    <div class="contenedor-auth">
        <div class="caja-auth">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <img src="assets/img/icon-Photoroom.png" alt="Logo" style="height:60px;mix-blend-mode:screen;filter:drop-shadow(0 0 8px var(--brillo1))">
            </div>
            <h1>Bienvenido</h1>
            <p class="subtitulo-auth">Accede a tu cuenta de Midnight Customs</p>

            <div id="mensajeError"></div>

            <form id="loginForm" action="../servidor/api/login.php" method="POST" novalidate>
                <div class="auth-grupo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="email">
                </div>
                <div class="auth-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="boton-neon btn-auth">Iniciar sesión</button>
            </form>

            <div class="enlace-auth">
                ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
            </div>
            <a href="index.html" class="volver-inicio">← Volver al inicio</a>
        </div>
    </div>

    <script src="assets/js/login.js?v=8"></script>
</body>
</html>
