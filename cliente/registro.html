<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta gratuita en Midnight Customs y empieza a configurar tu vehículo.">
    <title>Crear Cuenta | Midnight Customs</title>
    <link rel="stylesheet" href="assets/css/style.css?v=9">
    <link rel="stylesheet" href="assets/css/animaciones.css?v=9">
    <!-- Estilos específicos -->
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="contenedor-auth">
        <div class="caja-auth">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <img src="assets/img/icon-Photoroom.png" alt="Logo" class="auth-logo-img">
            </div>
            <h1>Crear Cuenta</h1>
            <p class="subtitulo-auth">Únete a Midnight Customs — es gratis</p>

            <div id="mensajeError" role="alert" aria-live="assertive" aria-atomic="true"></div>

            <form id="registroForm" action="../servidor/api/registro.php" method="POST" novalidate>
                <div class="auth-grupo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" autocomplete="given-name" aria-required="true" aria-describedby="error-nombre">
                    <span class="campo-ayuda" id="error-nombre" aria-live="polite"></span>
                </div>
                <div class="auth-grupo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="email" aria-required="true" aria-describedby="error-email">
                    <span class="campo-ayuda" id="error-email" aria-live="polite"></span>
                </div>
                <div class="auth-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" autocomplete="new-password" aria-required="true" aria-describedby="error-password">
                    <span class="campo-ayuda" id="error-password" aria-live="polite"></span>
                </div>
                <div class="auth-grupo">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repite la contraseña" autocomplete="new-password" aria-required="true" aria-describedby="error-confirm-password">
                    <span class="campo-ayuda" id="error-confirm-password" aria-live="polite"></span>
                </div>
                <button type="submit" class="boton-neon btn-auth">Registrarse</button>
            </form>

            <div class="enlace-auth">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
            <a href="index.html" class="volver-inicio">← Volver al inicio</a>
        </div>
    </div>

    <script type="module" src="assets/js/registro.js?v=9"></script>
</body>
</html>
